<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image View - 多模型工具</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🖼️ Image View 多模型工具</h1>
        <p style="color: #6b7280; margin-bottom: 20px;">纯 HTML + JS 网页版 · 支持文生图 / 图像编辑 / 图生视频</p>

        <!-- API Key -->
        <div class="input-group">
            <label>🔑 API Key</label>
            <input type="password" id="apiKey" placeholder="输入你的 API Key">
        </div>

        <!-- 模型选择 -->
        <div class="input-group">
            <label>🤖 选择模型</label>
            <select id="modelSelect">
                <option value="z-image">Z-Image-Turbo (文生图)</option>
                <option value="flux-dev">FLUX.1-dev (文生图)</option>
                <option value="flux-schnell">FLUX.1-schnell (文生图)</option>
                <option value="flux-2-dev">FLUX.2-dev (文生图)</option>
                <option value="edit-2511">Edit-2511 (图像编辑)</option>
                <option value="wan-video">Wan2.2 (图生视频)</option>
            </select>
        </div>

        <!-- 提示词 -->
        <div class="input-group" id="promptGroup">
            <label>📝 提示词 <span style="font-weight:400;color:#9ca3af;font-size:12px;">(Ctrl+Enter 生成)</span></label>
            <textarea id="prompt" rows="3" placeholder="描述你想要的画面..."></textarea>
        </div>

        <!-- 参数行 -->
        <div class="params-row" id="paramsRow">
            <div class="param-group" id="widthGroup">
                <label>宽度</label>
                <input type="number" id="width" value="1024" step="64" min="64" max="2048">
            </div>
            <div class="param-group" id="heightGroup">
                <label>高度</label>
                <input type="number" id="height" value="1024" step="64" min="64" max="2048">
            </div>
            <div class="param-group">
                <label>步数</label>
                <input type="number" id="steps" value="9" step="1" min="1" max="100">
            </div>
            <div class="param-group">
                <label>引导比例</label>
                <input type="number" id="guidance" value="7.0" step="0.1" min="0" max="20">
            </div>
        </div>

        <!-- 生成按钮 -->
        <button id="generateBtn">🚀 生成图片/视频</button>

        <!-- 状态栏 -->
        <div class="info-row">
            <span id="statusMsg">就绪</span>
            <span id="timeCost">⏱️ 上次耗时: --</span>
        </div>

        <!-- 进度条 -->
        <div class="progress-container" id="progressContainer" style="display:none;">
            <div class="progress-bar" id="progressBar"></div>
            <span class="progress-text" id="progressText">0%</span>
        </div>

        <!-- 输出区域 -->
        <div id="outputArea" style="margin-top: 16px; display:none;"></div>
    </div>

    <!-- 图片预览模态框 -->
    <div class="modal" id="imageModal">
        <span class="modal-close" id="modalClose">&times;</span>
        <img class="modal-content" id="modalImage" src="">
    </div>

    <script src="app.js"></script>
</body>
</html>
